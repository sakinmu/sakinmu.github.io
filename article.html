<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章转载</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", system-ui, sans-serif;
        }
        body {
            /* 主体暗色蓝色渐变 */
            background: linear-gradient(135deg, #0f172a, #1e2948, #111833);
            color:#e2e8f0;
            padding:24px;
            min-height:100vh;
        }
        /* 复古窗口样式 蓝色调 */
        .window {
            background: #1e2940;
            border: 2px solid #475580;
            border-radius: 6px;
            box-shadow: 4px 4px 0 #0b102088;
            overflow: hidden;
        }
        .win-title {
            background: linear-gradient(90deg, #3b4e80, #5068a8);
            color:white;
            padding:6px 10px;
            display:flex;
            justify-content: space-between;
            align-items:center;
            font-weight:bold;
            font-size:14px;
        }
        .win-btn span{
            display:inline-block;
            width:18px;height:18px;
            background:#d1d9f0;
            color:#222;
            text-align:center;
            margin-left:3px;
            border-radius:2px;
            font-size:12px;
            cursor:pointer;
        }
        .win-content{
            padding:12px;
        }
        .page-wrap{
            display:grid;
            grid-template-columns: 65% 33%;
            gap:2%;
            max-width:1400px;
            margin:0 auto;
        }
        /* 左侧文章列表窗口 */
        .article-list{
            height:85vh;
            overflow-y:auto;
        }
        /* 文章条目链接，整行点击 */
        .item a{
            display:block;
            text-decoration:none;
            color:inherit;
            padding:14px 10px;
            border-bottom:1px solid #334160;
        }
        .item a:hover{
            background:#2c3b5f;
        }
        .item-date{
            color:#89a2d8;
            font-size:13px;
            margin-bottom:4px;
        }
        .item h3{
            font-size:24px;
            color:#cbd5f0;
            margin-bottom:6px;
        }
        .item-desc{
            color:#94a3c7;
            font-size:14px;
        }
        .item .arrow{
            float:right;
            color:#7b99dd;
        }
        /* 右侧文库 */
        .library{
            height:60vh;
        }
        .folder-row{
            display:grid;
            grid-template-columns:1fr 1fr 1fr 1fr;
            gap:10px;
            margin-bottom:20px;
        }
        .folder{
            text-align:center;
            padding:8px;
        }
        .folder-box{
            width:50px;height:40px;
            background:#6078b0;
            border-radius:4px;
            margin:0 auto 4px;
        }
        .lib-item a{
            display:block;
            padding:8px 4px;
            border-bottom:1px solid #334160;
            font-size:14px;
            text-decoration:none;
            color:#cbd5f0;
        }
        .lib-item a:hover{
            background:#2c3b5f;
        }
        .lib-item .arrow{
            float:right;
            color:#7b99dd;
        }
        .back-home:hover{
            background:#4488ff;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-home">← 返回主页</a>
    <div class="page-wrap">
        <!-- 左侧：最近写下的 -->

                    </a>

                    </a>
                </div>
                <div class="item">

            </div>
        </div>
