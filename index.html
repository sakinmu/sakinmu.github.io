<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
        body{
            background:#121218;
            color:#e8e8e8;
            padding:40px 20px;
        }
        .container{
            max-width:700px;
            margin:0 auto;
        }
        .avatar{
            width:120px;height:120px;border-radius:50%;
            background:#4488ff;
            margin-bottom:24px;
            display:flex;align-items:center;justify-content:center;
            font-size:40px;font-weight:bold;
        }
        h1{font-size:36px;margin-bottom:10px;}
        .desc{color:#aaa;font-size:18px;margin-bottom:32px;line-height:1.6;}
        .card{
            background:#1e1e2b;
            padding:24px;border-radius:14px;margin-bottom:20px;
        }
        .card h2{font-size:20px;margin-bottom:12px;color:#7cb6ff;}
        .card p{line-height:1.7;color:#d8d8d8;}
        .links{margin-top:24px;display:flex;gap:16px;flex-wrap:wrap;}
        .links a{
            color:white;text-decoration:none;padding:10px 18px;border-radius:8px;
            background:#3366dd;transition:0.2s;
        }
        .links a:hover{background:#4488ff;transform:translateY(-2px);}
        footer{margin-top:40px;color:#777;font-size:14px;text-align:center;}
    </style>
</head>
<body>
<div class="container">
    <div class="avatar">S</div>
    <h1>你好，我是 sakinmu</h1>
    <p class="desc">一名在校学生｜喜欢代码、网络、创作</p>

    <div class="card">
        <h2>关于我</h2>
        <p>
            不存在。
        </p>
    </div>

    <div class="card">
        <h2>项目作品</h2>
        <p>这里后续可以放你的项目介绍。</p>
        <div class="links">
            <a href="https://github.com/sakinmu">GitHub</a>
        </div>
    </div>

    <div class="card">
        <h2>联系</h2>
        <p>你可以通过 GitHub 找到我。</p>
    </div>

    <footer>© 2026 sakinmu | 用 GitHub Pages 搭建</footer>
</div>
</body>
</html>
